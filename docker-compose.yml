services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./server
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://postgres:postgres@postgres:5432/gophprofile
      LOG_LEVEL: debug
      SERVER_ADDRESS: 0.0.0.0:8080
      RABBIT_DSN: amqp://guest:guest@rabbitmq:5672/
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_tmp:/tmp

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./worker
    environment:
      DB_DSN: postgres://postgres:postgres@postgres:5432/gophprofile
      LOG_LEVEL: debug
      RABBIT_DSN: amqp://guest:guest@rabbitmq:5672/
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_tmp:/tmp

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gophprofile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gophprofile"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP для приложений
      - "15672:15672"   # Веб-панель управления
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  rabbitmq_data:
  minio_data:
  postgres_data:
  shared_tmp: