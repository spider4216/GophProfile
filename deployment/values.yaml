postgres:
  image:
    repository: postgres
    tag: "18"
  replicas: 1
  containerPort: 5432
  service:
    port: 5432
  dbName: "gophprofile"

app:
  image:
    repository: gophprofile
    tag: "1.0"
  replicas: 1
  command: ["/root/server"]
  containerPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  
  hpa:
    minReplicas: 1
    maxReplicas: 3
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 80
  
  service:
    port: 8080

grafana:
  image:
    repository: grafana/grafana
    tag: "12.3.1"
  replicas: 1
  containerPort: 3000
  service:
    port: 3000
  pvc:
    storage: "100Mi"

jaeger:
  image:
    repository: jaegertracing/all-in-one
    tag: "latest"
  replicas: 1
  ports:
    containerPort: 16686
    otlpGRPCPort: 4317
    otlpHTTPPort: 4318
  service:
    servicePort: 16686
    otlpGRPCPort: 4317

loki:
  image:
    repository: grafana/loki
    tag: "3.6.3"
  replicas: 1
  containerPort: 3100
  pvc:
    storage: "100Mi"
  service:
    servicePort: 3100