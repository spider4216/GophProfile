apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: rabbitmq

  # Порты сервиса
  ports:
  - name: api         # Уникальное имя порта (для DNS SRV записей)
    port: 5672        # Порт, на котором сервис принимает запросы
    targetPort: 5672  # Порт контейнера в поде
  - name: web
    port: 15672       # Порт для WEB
    targetPort: 15672