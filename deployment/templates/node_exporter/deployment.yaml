apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-exporter
  labels:
    app: node-exporter
    version: '1.0'
spec:
  replicas: {{ .Values.node_exporter.replicas }}
  selector:
    matchLabels:
      app: node-exporter
      version: '1.0'      
  template:
    metadata:
      labels:
        app: node-exporter
        version: '1.0'
    spec:
      containers:
      - name: node-exporter
        image: "{{ .Values.node_exporter.image.repository }}:{{ .Values.node_exporter.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.node_exporter.containerPort }}