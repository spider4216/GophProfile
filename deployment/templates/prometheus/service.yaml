apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: prometheus

  # Порты сервиса
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.prometheus.service.port }}
    targetPort: {{ .Values.prometheus.containerPort }}