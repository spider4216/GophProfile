apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus       # Имя Deployment
  labels:
    app: prometheus      # Лейблы Deployment
    version: '1.0'
spec:
  replicas: 1          # Одна пода с postgres
  selector:
    matchLabels:
      app: prometheus    # По этим лейблам Deployment будет связан с контейнером
      version: '1.0'      
  template:
    metadata:
      labels:           # Лейблы подов. Должны совпадать со spec.selector.matchLabels!
        app: prometheus
        version: '1.0'
    spec:
      containers:                        # Описание контейнера
      - name: prometheus                   # Имя контейнера
        image: prom/prometheus:latest  # Образ и версия образа
        imagePullPolicy: IfNotPresent    # Политика скачивания образа
        ports:
          - containerPort: 9090        # Порт контейнера
        volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus