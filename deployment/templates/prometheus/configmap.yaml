apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus:{{ .Values.prometheus.service.port }}']

      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:{{ .Values.otel_collector.service.prometheusPort }}'] # Endpoint Prometheus-exporter Collector 
      
      - job_name: 'node'
        static_configs:
          - targets: ['node-exporter:{{ .Values.node_exporter.service.port }}']