apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-app-secret
type: Opaque
stringData:
  DB_DSN: {{ printf "%s://%s:postgres@postgres:%v/%s" .Values.secrets.postgres.username .Values.secrets.postgres.password .Values.postgres.containerPort .Values.postgres.dbName | quote }}
  RABBIT_DSN: amqp://{{ .Values.secrets.rabbitmq.username }}:{{ .Values.secrets.rabbitmq.password }}@rabbitmq:{{ .Values.rabbitmq.service.ports.api }}/
  MINIO_ROOT_USER: "{{ .Values.secrets.minio.username }}"
  MINIO_ROOT_PASSWORD: "{{ .Values.secrets.minio.password }}"