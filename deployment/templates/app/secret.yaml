apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-app-secret
type: Opaque
stringData:
  DB_DSN: {{ printf "postgres://postgres:postgres@postgres:%v/%s" .Values.postgres.containerPort .Values.postgres.dbName | quote }}
  RABBIT_DSN: amqp://guest:guest@rabbitmq:{{ .Values.rabbitmq.service.ports.api }}/
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: minio123