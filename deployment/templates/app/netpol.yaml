apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-app-netpol
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: gophprofile-app

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.app.containerPort }}