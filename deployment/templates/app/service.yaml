apiVersion: v1
kind: Service
metadata:
  name: gophprofile-app
  labels:
    app: gophprofile-app
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: gophprofile-app

  # Порты сервиса
  ports:
  - name: http                    # Уникальное имя порта (для DNS SRV записей)
    protocol: TCP                 # TCP или UDP
    port: 8080                    # Порт, на котором сервис принимает запросы
    targetPort: 8080              # Порт контейнера в поде