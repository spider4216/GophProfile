apiVersion: v1
kind: Service
metadata:
  name: gophprofile-app
  labels:
    app: gophprofile-app
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: gophprofile-app

  # Порты сервиса
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.app.service.port }}
    targetPort: {{ .Values.app.containerPort }}