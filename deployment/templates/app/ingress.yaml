apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gophprofile-app
  namespace: gophprofile
spec:
  ingressClassName: traefik
  rules:
  - host: gophprofile.loc
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gophprofile-app
            port:
              number: {{ .Values.app.service.port }}