apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: postgres

  # Порты сервиса
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.postgres.service.port }}
    targetPort: {{ .Values.postgres.containerPort }}