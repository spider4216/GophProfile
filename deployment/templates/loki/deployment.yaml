apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    version: '1.0'
spec:
  replicas: {{ .Values.loki.replicas }}
  selector:
    matchLabels:
      app: loki
      version: '1.0'      
  template:
    metadata:
      labels:
        app: loki
        version: '1.0'
    spec:
      containers:
      - name: loki
        image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
        imagePullPolicy: IfNotPresent
        args:
          - "-config.file=/etc/loki/local-config.yml"
        ports:
          - containerPort: {{ .Values.loki.containerPort }}
        volumeMounts:
            - name: loki-data
              mountPath: /loki
            - name: loki-config
              mountPath: /etc/loki/local-config.yml
              subPath: loki-config.yml
      volumes:
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-pvc
        - name: loki-config
          configMap:
            name: loki