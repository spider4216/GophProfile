apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: minio

  # Порты сервиса
  ports:
  - name: api
    port: {{ .Values.minio.service.port.api }}
    targetPort: {{ .Values.minio.ports.api }}
  - name: web
    port: {{ .Values.minio.service.port.web }}
    targetPort: {{ .Values.minio.ports.web }}