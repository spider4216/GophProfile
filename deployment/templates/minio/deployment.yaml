apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio          # Имя Deployment
  labels:
    app: minio         # Лейблы Deployment
    version: '1.0'
spec:
  replicas: {{ .Values.minio.replicas }}
  selector:
    matchLabels:
      app: minio       # По этим лейблам Deployment будет связан с контейнером
      version: '1.0'      
  template:
    metadata:
      labels:          # Лейблы подов. Должны совпадать со spec.selector.matchLabels!
        app: minio
        version: '1.0'
    spec:
      containers:                                               # Описание контейнера
      - name: minio                                             # Имя контейнера
        image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
        imagePullPolicy: IfNotPresent                           # Политика скачивания образа
        command: {{- toYaml .Values.minio.command | nindent 12 }}
        args: {{- toYaml .Values.minio.args | nindent 12 }}
        ports:
          - name: api
            containerPort: {{ .Values.minio.ports.api }}
          - name: web
            containerPort: {{ .Values.minio.ports.web }}
        envFrom:                       # Все ключи ConfigMap будут использованы как переменные окружения контейнера
          - secretRef:
              name: minio-secret
        volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc 