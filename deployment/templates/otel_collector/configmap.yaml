apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  otel-collector-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.otel_collector.ports.containerGRPCPort }}
          http:
            endpoint: 0.0.0.0:{{ .Values.otel_collector.ports.containerHTTPPort }}

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      resource/add-job:
        attributes:
          - key: job
            from_attribute: service.name
            action: upsert

    exporters:
      otlphttp/loki:
        endpoint: http://loki:{{ .Values.loki.service.servicePort }}/otlp
        compression: "gzip"
        tls:
          insecure: true
      prometheus:
        endpoint: '0.0.0.0:{{ .Values.otel_collector.service.ports.prometheusPort }}'
      otlp/traces:
        endpoint: 'jaeger:{{ .Values.jaeger.service.otlpGRPCPort }}'
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors:
            - resource/add-job
            - batch
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus] 
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/traces] 