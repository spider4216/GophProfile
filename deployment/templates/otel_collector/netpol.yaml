# Network Policy для Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-netpol
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: otel-collector

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gophprofile-app
        - podSelector:
            matchLabels:
              app: gophprofile
      ports:
        - protocol: TCP
          port: {{ .Values.otel_collector.ports.containerGRPCPort }}
        - protocol: TCP
          port: {{ .Values.otel_collector.ports.containerHTTPPort }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.otel_collector.ports.containerPrometheusPort }}