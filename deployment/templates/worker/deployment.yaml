apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile
  labels:
    app: gophprofile
    version: '1.0'
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: gophprofile
      version: '1.0'      
  template:
    metadata:
      labels:
        app: gophprofile
        version: '1.0'
    spec:
      containers:
      - name: gophprofile
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: Never
        command: {{ .Values.worker.command }}
        ports:
        - containerPort: {{ .Values.worker.containerPort }}
        envFrom:
          - configMapRef:
              name: gophprofile
          - secretRef:
              name: gophprofile-secret
        volumeMounts:
            - name: shared-tmp
              mountPath: /tmp
      volumes:
        - name: shared-tmp
          persistentVolumeClaim:
            claimName: shared-tmp