apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: rabbitmq

  # Порты сервиса
  ports:
  - name: api
    port: {{ .Values.rabbitmq.service.ports.api }}
    targetPort: {{ .Values.rabbitmq.ports.api }}
  - name: web
    port: {{ .Values.rabbitmq.service.ports.web }}
    targetPort: {{ .Values.rabbitmq.ports.web }}