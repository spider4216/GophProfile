apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: grafana

  # Порты сервиса
  ports:
  - name: http                    # Уникальное имя порта (для DNS SRV записей)
    protocol: TCP                 # TCP или UDP
    port: 3000                    # Порт, на котором сервис принимает запросы
    targetPort: 3000              # Порт контейнера в поде