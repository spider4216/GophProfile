apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  labels:
    app: node-exporter
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: node-exporter

  # Порты сервиса
  ports:
  - name: http                    # Уникальное имя порта (для DNS SRV записей)
    protocol: TCP                 # TCP или UDP
    port: 9100                    # Порт, на котором сервис принимает запросы
    targetPort: 9100              # Порт контейнера в поде