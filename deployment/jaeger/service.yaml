apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: jaeger

  # Порты сервиса
  ports:
  - name: http                    # Уникальное имя порта (для DNS SRV записей)
    protocol: TCP                 # TCP или UDP
    port: 16686                   # Порт, на котором сервис принимает запросы
    targetPort: 16686             # Порт контейнера в поде
  - name: otlp-grpc
    protocol: TCP
    port: 4317
    targetPort: 4317