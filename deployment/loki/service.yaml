apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: loki

  # Порты сервиса
  ports:
  - name: loki-port               # Уникальное имя порта (для DNS SRV записей)
    protocol: TCP                 # TCP или UDP
    port: 3100                    # Порт, на котором сервис принимает запросы
    targetPort: 3100              # Порт контейнера в поде