apiVersion: v1
kind: ConfigMap
metadata:
  name: gophprofile
data:
  DB_DSN: postgres://postgres:postgres@postgres:5432/gophprofile # todo в secrets
  LOG_LEVEL: debug
  RABBIT_DSN: amqp://guest:guest@rabbitmq:5672/ # todo в secrets
  MINIO_HOST: http://minio:9000
  MINIO_ROOT_USER: minio # todo в secrets
  MINIO_ROOT_PASSWORD: minio123 # todo в secrets
  OTEL_SERVICE_NAME: worker
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTEL_EXPORTER_OTLP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_INSECURE: "true"