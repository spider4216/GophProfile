apiVersion: 2

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:{{ .Values.loki.service.servicePort }}
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://monitoring-kube-prometheus-prometheus:{{ .Values.prometheus.service.port }}
    isDefault: false
    editable: true
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:{{ .Values.jaeger.service.servicePort }}
    isDefault: false
    editable: true