apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
    version: '1.0'
spec:
  # Тип сервиса
  type: ClusterIP
   
  # Селектор. Выбирает Pods для маршрутизации трафика по их лейблам
  selector:
    app: otel-collector

  # Порты сервиса
  ports:
  - name: grpc-port         # Уникальное имя порта (для DNS SRV записей)
    port: 4317        # Порт, на котором сервис принимает запросы
    targetPort: 4317  # Порт контейнера в поде
  - name: http-port
    port: 4318       
    targetPort: 4318
  - name: prometheus-port
    port: 8889       
    targetPort: 8889
  - name: health-port
    port: 13133       
    targetPort: 13133