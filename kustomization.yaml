apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment/grafana/deployment.yaml
  - deployment/grafana/service.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboard.yml=./grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/provisioning/dashboards/kpi-dashboard.json
      - ./grafana/provisioning/dashboards/overview-dashboard.json
      - ./grafana/provisioning/dashboards/red-dashboard.json
  - name: grafana-datasources
    files:
      - datasources.yml=./grafana/provisioning/datasources/datasources.yml